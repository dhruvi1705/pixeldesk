<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges" width="100%" height="100%">
  <!-- Eyes glancing toward calendar on the right -->
  <rect x="13" y="13" width="2" height="2" fill="#24324A" />
  <rect x="14" y="13" width="1" height="1" fill="#FFFFFF" />
  <rect x="19" y="13" width="2" height="2" fill="#24324A" />
  <rect x="20" y="13" width="1" height="1" fill="#FFFFFF" />

  <!-- Calendar Desk Prop on right side -->
  <!-- Outer Frame -->
  <rect x="17" y="19" width="13" height="11" fill="#24324A" />
  <!-- Stand Legs -->
  <rect x="18" y="30" width="2" height="2" fill="#24324A" />
  <rect x="27" y="30" width="2" height="2" fill="#24324A" />

  <!-- Red Header Bar -->
  <rect x="18" y="20" width="11" height="2" fill="#E76F51" />
  <!-- Binder Rings -->
  <rect x="20" y="18" width="1" height="2" fill="#FFFFFF" />
  <rect x="23" y="18" width="1" height="2" fill="#FFFFFF" />
  <rect x="26" y="18" width="1" height="2" fill="#FFFFFF" />

  <!-- White Calendar Grid Page -->
  <rect x="18" y="22" width="11" height="7" fill="#FFFFFF" />

  <!-- Grid of Date Dots -->
  <rect x="19" y="23" width="1" height="1" fill="#24324A" />
  <rect x="21" y="23" width="1" height="1" fill="#24324A" />
  <rect x="23" y="23" width="1" height="1" fill="#24324A" />
  <rect x="25" y="23" width="1" height="1" fill="#24324A" />
  <rect x="27" y="23" width="1" height="1" fill="#24324A" />

  <!-- Highlighted Event Date in Teal -->
  <rect x="21" y="25" width="2" height="2" fill="#4E9F9A" />
  <rect x="24" y="25" width="1" height="1" fill="#24324A" />
  <rect x="26" y="25" width="1" height="1" fill="#24324A" />

  <rect x="19" y="27" width="1" height="1" fill="#24324A" />
  <rect x="23" y="27" width="1" height="1" fill="#24324A" />
  <rect x="25" y="27" width="1" height="1" fill="#24324A" />

  <!-- Hand pointing toward calendar -->
  <rect x="13" y="24" width="4" height="2" fill="#24324A" />
  <rect x="13" y="24" width="3" height="1" fill="#F4B886" />
</svg>
