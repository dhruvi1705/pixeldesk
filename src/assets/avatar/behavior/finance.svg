<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges" width="100%" height="100%">
  <!-- Eyes Looking Down at Ledger / Calculator -->
  <rect x="12" y="14" width="2" height="2" fill="#24324A" />
  <rect x="13" y="14" width="1" height="1" fill="#FFFFFF" />
  <rect x="18" y="14" width="2" height="2" fill="#24324A" />
  <rect x="19" y="14" width="1" height="1" fill="#FFFFFF" />

  <!-- Pocket Calculator / Ledger Device (held in center-right) -->
  <!-- Body Frame -->
  <rect x="16" y="20" width="12" height="11" fill="#24324A" />
  <rect x="17" y="21" width="10" height="9" fill="#182232" />

  <!-- Teal Digital LCD Screen -->
  <rect x="18" y="22" width="8" height="3" fill="#4E9F9A" />
  <!-- Numbers on Screen (e.g. Rupee / Numbers) -->
  <rect x="19" y="23" width="2" height="1" fill="#182232" />
  <rect x="22" y="23" width="3" height="1" fill="#182232" />

  <!-- Keypad Grid -->
  <rect x="18" y="26" width="2" height="1" fill="#EDE5D3" />
  <rect x="21" y="26" width="2" height="1" fill="#EDE5D3" />
  <rect x="24" y="26" width="2" height="1" fill="#EDE5D3" />

  <rect x="18" y="28" width="2" height="1" fill="#EDE5D3" />
  <rect x="21" y="28" width="2" height="1" fill="#E9C46A" />
  <!-- Coral Accent Enter Key -->
  <rect x="24" y="28" width="2" height="1" fill="#E76F51" />

  <!-- Finger / Hand Tapping Keypad -->
  <rect x="13" y="26" width="3" height="2" fill="#24324A" />
  <rect x="14" y="26" width="2" height="1" fill="#F4B886" />
</svg>
