<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges" width="100%" height="100%">
  <!-- Eyes Looking Down at Notepad -->
  <rect x="12" y="14" width="2" height="2" fill="#24324A" />
  <rect x="13" y="14" width="1" height="1" fill="#FFFFFF" />
  <rect x="18" y="14" width="2" height="2" fill="#24324A" />
  <rect x="19" y="14" width="1" height="1" fill="#FFFFFF" />

  <!-- Notepad / Journal held in front -->
  <!-- Notepad cover / border -->
  <rect x="10" y="22" width="12" height="9" fill="#24324A" />
  <rect x="10" y="22" width="3" height="9" fill="#E76F51" />
  <!-- Cream page -->
  <rect x="13" y="23" width="8" height="7" fill="#F7F1E3" />
  <!-- Written lines of notes -->
  <rect x="14" y="24" width="6" height="1" fill="#4E9F9A" />
  <rect x="14" y="26" width="5" height="1" fill="#8D86C9" />
  <rect x="14" y="28" width="6" height="1" fill="#24324A" />

  <!-- Hand holding pencil -->
  <rect x="19" y="21" width="3" height="3" fill="#24324A" />
  <rect x="19" y="21" width="2" height="2" fill="#F4B886" />
  <!-- Pencil -->
  <rect x="21" y="18" width="2" height="1" fill="#FF9F93" />
  <rect x="21" y="19" width="2" height="4" fill="#E9C46A" />
  <rect x="20" y="23" width="2" height="1" fill="#FFEAD2" />
  <rect x="19" y="24" width="1" height="1" fill="#24324A" />
</svg>
