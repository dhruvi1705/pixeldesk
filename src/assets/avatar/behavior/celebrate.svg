<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges" width="100%" height="100%">
  <!-- Joyful Curved Eyes (^ ^) -->
  <rect x="11" y="13" width="1" height="1" fill="#24324A" />
  <rect x="12" y="12" width="2" height="1" fill="#24324A" />
  <rect x="14" y="13" width="1" height="1" fill="#24324A" />

  <rect x="17" y="13" width="1" height="1" fill="#24324A" />
  <rect x="18" y="12" width="2" height="1" fill="#24324A" />
  <rect x="20" y="13" width="1" height="1" fill="#24324A" />

  <!-- Big Joyful Smile -->
  <rect x="14" y="16" width="4" height="2" fill="#24324A" />
  <rect x="15" y="16" width="2" height="1" fill="#E76F51" />

  <!-- Raised Arms / Hands Reaching High in Victory -->
  <!-- Left arm & hand up -->
  <rect x="4" y="16" width="3" height="7" fill="#24324A" />
  <rect x="4" y="16" width="2" height="6" fill="#4E9F9A" />
  <rect x="3" y="13" width="4" height="3" fill="#24324A" />
  <rect x="4" y="14" width="2" height="2" fill="#F4B886" />

  <!-- Right arm & hand up -->
  <rect x="25" y="16" width="3" height="7" fill="#24324A" />
  <rect x="26" y="16" width="2" height="6" fill="#4E9F9A" />
  <rect x="25" y="13" width="4" height="3" fill="#24324A" />
  <rect x="26" y="14" width="2" height="2" fill="#F4B886" />

  <!-- Pixel Celebration Stars & Confetti -->
  <!-- Top Left Star -->
  <rect x="4" y="5" width="3" height="1" fill="#E9C46A" />
  <rect x="5" y="4" width="1" height="3" fill="#E9C46A" />

  <!-- Top Right Star -->
  <rect x="26" y="4" width="3" height="1" fill="#E9C46A" />
  <rect x="27" y="3" width="1" height="3" fill="#E9C46A" />

  <!-- Subtle Teal Sparkle -->
  <rect x="2" y="9" width="2" height="2" fill="#4E9F9A" />
  <rect x="29" y="8" width="2" height="2" fill="#4E9F9A" />
</svg>
