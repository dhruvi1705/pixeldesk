<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges" width="100%" height="100%">
  <!-- Thinking / Analyzing Eyes glancing down-center -->
  <rect x="12" y="13" width="2" height="2" fill="#24324A" />
  <rect x="13" y="14" width="1" height="1" fill="#FFFFFF" />
  <rect x="18" y="13" width="2" height="2" fill="#24324A" />
  <rect x="18" y="14" width="1" height="1" fill="#FFFFFF" />

  <!-- Analytics Monitor with Growing Bars & Trend Graph -->
  <!-- Outer Bezel -->
  <rect x="9" y="19" width="14" height="10" fill="#24324A" />
  <rect x="15" y="29" width="2" height="2" fill="#24324A" />
  <rect x="13" y="30" width="6" height="1" fill="#24324A" />

  <!-- Dark Display Surface -->
  <rect x="10" y="20" width="12" height="8" fill="#182232" />

  <!-- Grid Lines -->
  <rect x="11" y="26" width="10" height="1" fill="#24324A" />

  <!-- Bar 1 (Teal) -->
  <rect x="12" y="24" width="2" height="2" fill="#4E9F9A" />
  <!-- Bar 2 (Golden Yellow) -->
  <rect x="15" y="22" width="2" height="4" fill="#E9C46A" />
  <!-- Bar 3 (Coral) -->
  <rect x="18" y="21" width="2" height="5" fill="#E76F51" />

  <!-- Trend Line Point -->
  <rect x="12" y="23" width="1" height="1" fill="#FFFFFF" />
  <rect x="15" y="21" width="1" height="1" fill="#FFFFFF" />
  <rect x="18" y="20" width="1" height="1" fill="#FFFFFF" />
  <rect x="19" y="19" width="1" height="1" fill="#4E9F9A" />
</svg>
