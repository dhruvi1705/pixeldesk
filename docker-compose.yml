services:
  # Local PostgreSQL Database for PixelDesk Development
  db:
    image: postgres:16-alpine
    container_name: pixeldesk_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-pixeldesk_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pixeldesk_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-pixeldesk_dev}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pixeldesk_pg_data:
    name: pixeldesk_pg_data
